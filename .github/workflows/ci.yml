name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Each commit on the default branch gets its OWN group, so no main run ever
  # queues behind another. Not cancelling is not enough on its own: a group
  # holds one running plus one pending run, and a third push evicts the pending
  # one, which is how a middle commit loses its validation record even with
  # cancel-in-progress off. Pull request branches keep the shared group and
  # still cancel superseded runs, which is what you want there.
  group: validate-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Audit dependencies
        run: pnpm run audit

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
