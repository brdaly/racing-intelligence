name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Each commit on the default branch gets its OWN group, so no main run ever
  # queues behind another. Not cancelling is not enough on its own: a group
  # holds one running plus one pending run, and a third push evicts the pending
  # one, which is how a middle commit loses its validation record even with
  # cancel-in-progress off. Pull request branches keep the shared group and
  # still cancel superseded runs, which is what you want there.
  group: validate-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run audit:prod

      - name: Audit all dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run audit

  # Preserve the existing required-check name and require both independent jobs.
  validate:
    if: ${{ always() }}
    needs: [application, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require application and security checks
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$AUDIT_RESULT" = success
